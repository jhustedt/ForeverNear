<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zuki | ForeverNear</title>
<meta name="description" content="In memory of Zuki, February 25, 2012 – August 15, 2026.">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="../shared/gallery.css">
<style>
  /* Zuki's page uses its own palette: light tan, like her coat.
     The root directory page keeps the twilight-blue theme — this
     override only applies here. */
  :root {
    --bg-deep: #f3e6c9;
    --bg-panel: #ecdcb6;
    --line: rgba(120, 74, 28, 0.16);
    --ink: #3d2b1a;
    --ink-soft: #8a6f4d;
    --gold: #bf6d2e;
    --gold-soft: rgba(191, 109, 46, 0.45);
  }

  body {
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #faf1da 0%, var(--bg-deep) 55%);
  }

  /* swap the cool starfield flecks for warm sunlit dust */
  body::before {
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(140,90,40,0.16), transparent),
      radial-gradient(1.5px 1.5px at 78% 32%, rgba(140,90,40,0.13), transparent),
      radial-gradient(1px 1px at 45% 62%, rgba(140,90,40,0.14), transparent),
      radial-gradient(1.5px 1.5px at 88% 78%, rgba(140,90,40,0.11), transparent),
      radial-gradient(1px 1px at 25% 85%, rgba(140,90,40,0.12), transparent),
      radial-gradient(1.5px 1.5px at 60% 10%, rgba(140,90,40,0.1), transparent);
  }

  .memorial-hero { padding: 88px 0 8px; text-align: center; }
  .memorial-hero h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    margin: 22px 0 8px;
    letter-spacing: -0.01em;
  }
  .memorial-hero .dates {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  .intro {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 36px;
    align-items: center;
    margin: 48px 0;
  }
  .intro-photo {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--line);
  }
  .dedication {
    font-family: var(--body);
    font-size: 1.15rem;
    font-style: italic;
    color: var(--ink);
  }
  .dedication .placeholder-note {
    display: block;
    font-family: var(--mono);
    font-style: normal;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--gold-soft);
    margin-top: 14px;
  }

  @media (max-width: 640px) {
    .intro { grid-template-columns: 1fr; gap: 20px; }
    .intro-photo { aspect-ratio: 4 / 3; }
  }

  .back-link {
    display: inline-block;
    margin: 0 0 8px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .back-link:hover { color: var(--gold); }

  .wrap { max-width: 1100px; }

  @media (min-width: 900px) {
    .gallery { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<div class="wrap">

  <a class="back-link" href="../">&larr; forevernear.us</a>

  <div class="memorial-hero">
    <div class="star" aria-hidden="true"></div>
    <h1>Zuki</h1>
    <p class="dates">February 25, 2012 &ndash; August 15, 2026</p>
  </div>

  <!--
    Cover photo: add zuki/media/cover.jpg (same file used as her portrait
    on the home page) and it will appear here automatically. Until then a
    plain placeholder is shown instead of a broken image.

    Dedication text below is a placeholder — replace the paragraph inside
    <p class="dedication"> with the real words whenever you're ready.
    You can delete the <span class="placeholder-note"> line once it's real.
  -->
  <div class="intro">
    <img class="intro-photo" src="./media/cover.jpg" alt="Zuki"
         onerror="this.onerror=null;this.src='./cover-placeholder.svg';">
    <p class="dedication">
      Here is where Zuki's dedication will go — a few lines about who she was,
      what she loved, and what she meant. Replace this paragraph whenever you're ready.
      <span class="placeholder-note">placeholder text — edit in zuki/index.html</span>
    </p>
  </div>

  <hr class="rule">

  <!--
    GALLERY — how to add photos and videos:

    1. Drop image/video files into the zuki/media/ folder in this repo.
    2. Copy one of the blocks below and update the file path + caption.
    3. Photos: use a <button class="gallery-item" data-lightbox="image" ...>
       Videos: use a <button class="gallery-item is-video" data-lightbox="video" ...>
       and give it a poster image so the grid shows a still frame.

    Clicking any tile opens it in the in-page lightbox — it plays/displays
    right in the browser, it does not download.
  -->
  <div class="gallery">

    <!-- Example photo tile (duplicate this block per photo) -->
    <button class="gallery-item" data-lightbox="image" data-src="./media/photo-01.jpg" data-caption="">
      <img src="./media/photo-01.jpg" alt="Zuki" loading="lazy">
    </button>

    <!-- Example video tile (duplicate this block per video) -->
    <button class="gallery-item is-video" data-lightbox="video" data-src="./media/video-01.mp4" data-caption="">
      <img src="./media/video-01-poster.jpg" alt="Video of Zuki" loading="lazy">
    </button>

  </div>

</div>

<footer class="site-footer">forevernear.us/zuki</footer>

<script src="../shared/lightbox.js"></script>
</body>
</html>
